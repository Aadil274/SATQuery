name: SatQuery AI - Continuous Integration

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-backend:
    name: Backend Unit Tests & Query Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install Production Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Complete Automated Test Suite (24 Tests)
        run: |
          python -m unittest discover -s backend/tests -p "test_*.py"

      - name: Verify Multi-Task Query Reasoning
        run: |
          python backend/tests/verify_queries.py

      - name: Validate LoRA Benchmark Evaluation Script
        run: |
          python training/train_lora_rs_vlm.py --eval

  build-frontend:
    name: Frontend Build & Type Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build React 19 Production Bundle
        working-directory: ./frontend
        run: npm run build
